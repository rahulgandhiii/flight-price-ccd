name: Upload sample flight to CCD pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

jobs:
  send-flight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send sample flight to AWS
        env:
          FLIGHT_INGEST_URL: ${{ secrets.FLIGHT_INGEST_URL }}
          FLIGHT_INGEST_TOKEN: ${{ secrets.FLIGHT_INGEST_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "X-Flight-Token: $FLIGHT_INGEST_TOKEN" \
            --data-binary @sample_input.json \
            "$FLIGHT_INGEST_URL"
